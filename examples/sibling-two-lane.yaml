# Example: two parallel lanes against a sibling repo under AGENT_MANAGER_DEV_ROOT.
# Replace `repo` with any folder name next to your agent-manager clone.
# Workers inherit that repo's agent files / skills / MCP.
# No commit — Master Dev / Ship Gate owns shipping.

repo: my-sibling-repo
harness_default: claude

feed:
  enabled: false
  baseUrl: http://localhost:8787
  topic: agent-manager/example-repo

policy:
  allow_commit: false
  allow_pr: false
  stall_timeout_sec: 900
  permission_mode: acceptEdits
planning:
  source_refs: [replace-with-source-reference]
  plan_ref: replace-with-approved-plan-reference
  context_file: agent-manager.context.md
  reviewed_base_sha: "0000000000000000000000000000000000000000"
  verified_by: replace-with-manager-agent
  verified_at: 2026-01-01T00:00:00Z
  reviewed_paths: [BUILD_PLAN.md, Version.md]
  repository_instruction_refs: [AGENTS.md]
  attestations:
    source_reviewed: true
    repository_instructions_reviewed: true
    relevant_code_reviewed: true
    scope_verified: true

lanes:
  - id: build-plan
    scope: "BUILD_PLAN.md"
    prompt: |
      You are on a dedicated worktree/branch for lane build-plan only.
      Update BUILD_PLAN.md so the current-state summary matches the repo.
      Stay in BUILD_PLAN.md only. Do not invent hostnames or internal IDs.
      Do not commit.

  - id: version-md
    scope: "Version.md"
    prompt: |
      You are on a dedicated worktree/branch for lane version-md only.
      Create or update root Version.md from CHANGELOG / package.json as needed.
      Prefer omitting inventing Formal Flow; mark TBD where operator must set
      dev_flow / test_gate. Stay in Version.md only. Do not commit.
