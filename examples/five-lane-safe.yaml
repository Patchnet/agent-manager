# Five scoped lanes with three active workers at a time.
# Review every scope and prompt before using this as a real workflow.
repo: agent-manager
goal: Land one approved change across source, tests, docs, examples, and schema.
harness_default: codex
claim_mode: required
max_concurrency: 3
integrate: true

policy:
  allow_commit: false
  allow_pr: false
  permission_mode: workspace-write

verification:
  setup:
    commands:
      - command: npm
        args: [ci]
  commands:
    - command: npm
      args: [test]

lanes:
  - id: implementation
    scope:
      - src/**
    prompt: Implement the approved source changes. Do not modify tests or documentation.

  - id: tests
    depends_on: [implementation]
    scope:
      - test/**
    prompt: Add focused tests against the completed implementation.

  - id: documentation
    scope:
      - docs/**
    prompt: Update operator documentation for the approved behavior.

  - id: examples
    scope:
      - examples/**
    prompt: Update checked-in examples without including private environment details.

  - id: schema
    scope:
      - schemas/**
    prompt: Update the public workflow schema for the approved behavior.
