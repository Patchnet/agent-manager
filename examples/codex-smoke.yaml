# Minimal Codex harness smoke workflow (read-only style prompt).
# Run: node bin/agent-manager.mjs run examples/codex-smoke.yaml --detach

repo: agent-manager
harness_default: codex
target_dev_flow: simple

policy:
  allow_commit: false
  allow_pr: false
  stall_timeout_sec: 600
  permission_mode: acceptEdits
planning:
  source_refs: [replace-with-source-reference]
  plan_ref: replace-with-approved-plan-reference
  context_file: examples/agent-manager.context.md
  reviewed_base_sha: "0000000000000000000000000000000000000000"
  verified_by: replace-with-manager-agent
  verified_at: 2026-01-01T00:00:00Z
  reviewed_paths: [README.md]
  repository_instruction_refs: [AGENTS.md]
  attestations:
    source_reviewed: true
    repository_instructions_reviewed: true
    relevant_code_reviewed: true
    scope_verified: true

lanes:
  - id: codex-ping
    scope: "README.md"
    prompt: |
      You are a read-only smoke lane for agent-manager's Codex harness.
      Confirm the worktree cwd contains README.md and summarize the first
      heading in one short sentence. Do not edit files. Do not commit.
