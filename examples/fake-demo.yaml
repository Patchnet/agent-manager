# Reference shape for the built-in fake harness. Replace `repo` with a scratch
# Git repository before running it; the fake harness never calls a model.
#
#   agent-manager validate examples/fake-demo.yaml --repo <scratch-repo>

repo: replace-with-absolute-repository-path
goal: Show the fake harness writing a file and resuming after an operator reply.
harness_default: fake
claim_mode: off
integrate: true
policy:
  allow_commit: false
  allow_pr: false
  poll_interval_ms: 100
  stall_timeout_sec: 30
lanes:
  - id: demo-write
    scope: demo-output.txt
    expected_outputs: [demo-output.txt]
    prompt: Create the demo output.
    fake:
      write:
        path: demo-output.txt
        content: demo complete
  - id: demo-question
    scope: demo-answer.txt
    expected_outputs: [demo-answer.txt]
    prompt: Ask for a value, then resume.
    fake:
      needs_input: Which value should the demo use?
      resume:
        write:
          path: demo-answer.txt
          content: operator answered
