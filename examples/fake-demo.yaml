# Reference shape for the built-in fake harness. This file is intentionally not
# runnable: its repository and reviewed base are placeholders.
#
# To create a current workflow in a safe scratch repository and explicitly opt
# into the fake harness, run:
#
#   agent-manager demo
#
# Add --no-run to scaffold without launching, or --dir <path> to choose the
# scratch location. Agent Manager refuses to replace a non-demo directory.

repo: replace-with-absolute-repository-path
harness_default: fake
claim_mode: off
integrate: true
policy:
  allow_commit: false
  allow_pr: false
  poll_interval_ms: 100
  stall_timeout_sec: 30
planning:
  source_refs: [replace-with-source-reference]
  plan_ref: replace-with-approved-plan-reference
  context_file: examples/agent-manager.context.md
  reviewed_base_sha: "0000000000000000000000000000000000000000"
  verified_by: replace-with-manager-agent
  verified_at: 2026-01-01T00:00:00Z
  reviewed_paths: [examples/**]
  repository_instruction_refs: [AGENTS.md]
  attestations:
    source_reviewed: true
    repository_instructions_reviewed: true
    relevant_code_reviewed: true
    scope_verified: true
lanes:
  - id: demo-write
    scope: demo-output.txt
    expected_outputs: [demo-output.txt]
    prompt: Create the demo output.
    fake:
      write:
        path: demo-output.txt
        content: demo complete
  - id: demo-question
    scope: demo-answer.txt
    expected_outputs: [demo-answer.txt]
    prompt: Ask for a value, then resume.
    fake:
      needs_input: Which value should the demo use?
      resume:
        write:
          path: demo-answer.txt
          content: operator answered
