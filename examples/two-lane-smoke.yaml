# Two parallel read-only lanes against this repo (smoke / demo).
# Run from a parent that contains `agent-manager` as a folder, or set
# AGENT_MANAGER_DEV_ROOT to that parent:
#   node bin/agent-manager.mjs run examples/two-lane-smoke.yaml --detach

repo: agent-manager
harness_default: claude
target_dev_flow: simple

feed:
  enabled: false

policy:
  allow_commit: false
  allow_pr: false
  stall_timeout_sec: 600
  permission_mode: readOnly
delivery:
  mode: review-only
planning:
  source_refs: [replace-with-source-reference]
  plan_ref: replace-with-approved-plan-reference
  context_file: examples/agent-manager.context.md
  reviewed_base_sha: "0000000000000000000000000000000000000000"
  verified_by: replace-with-manager-agent
  verified_at: 2026-01-01T00:00:00Z
  reviewed_paths: [README.md, Version.md]
  repository_instruction_refs: [AGENTS.md]
  attestations:
    source_reviewed: true
    repository_instructions_reviewed: true
    relevant_code_reviewed: true
    scope_verified: true

lanes:
  - id: readme-summary
    scope: "README.md"
    prompt: |
      You are on a dedicated worktree for lane readme-summary only.
      Summarize README.md in three short bullets. Do not edit files. Do not commit.

  - id: version-check
    scope: "Version.md"
    prompt: |
      You are on a dedicated worktree for lane version-check only.
      Report the frontmatter `current` version from Version.md in one sentence.
      Do not edit files. Do not commit.
