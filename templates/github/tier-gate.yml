# Optional: make "no usable ship policy" a GitHub check. Not for a repository
# with the pipeline gate, which does not use tiers.
#
# Copy to .github/workflows/tier-gate.yml, vendor tools/ship-tier.mjs from
# agent-manager to .github/scripts/ship-tier.mjs, and add `tier-gate` to the
# required checks. A base branch with a missing or empty policy file fails this
# check until someone adds the `ship:approved` label (one tap in the GitHub
# mobile app); it never means tier 1. A malformed policy file fails until it is
# fixed. Every tier passes: a tier is a label, not an approval step.
#
# The policy is read from the base branch, so a PR cannot change it for itself.
# Like any pull_request workflow this guards against accidents, not against a
# PR that edits the workflow itself.
name: tier-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  tier-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Classify changed paths
        env:
          BASE: origin/${{ github.base_ref }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'ship:approved') }}
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/ship-tiers.yml"
          git show "$BASE:.github/ship-tiers.yml" > "$policy" 2>/dev/null || : > "$policy"
          # Checked here too, so an older vendored ship-tier.mjs cannot fall back to tier 1.
          if ! grep -qE '^(default|tier0|tier2):' "$policy"; then
            if [ "$APPROVED" = "true" ]; then
              echo "No usable ship-tiers.yml on $BASE; ship:approved is set."
              exit 0
            fi
            echo "::error::No usable .github/ship-tiers.yml on $BASE: an operator adds one, or adds the ship:approved label to merge."
            exit 1
          fi
          node .github/scripts/ship-tier.mjs --base "$BASE" --file "$policy"
